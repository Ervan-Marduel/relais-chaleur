name: Publier la visite V3.1 sur GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/captures/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Activer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer la visite du vrai site
        run: |
          mkdir -p _site/docs/captures
          cp index.html _site/index.html
          cp docs/captures/*.png _site/docs/captures/
          touch _site/.nojekyll
      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
