name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rc
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rc_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U rc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rc@127.0.0.1:54329/rc_test
      E2E_DATABASE_URL: postgres://rc@127.0.0.1:54329/rc_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: psql -h 127.0.0.1 -p 54329 -U rc -d rc_test -c "CREATE DATABASE rc_e2e"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
